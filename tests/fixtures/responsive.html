<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive regression fixture</title></head>
<body style="margin:0;background:#f0f7ff"><div id="root"></div>
<script type="module">
  import React from 'react'
  import {createRoot} from 'react-dom/client'
  import Tutorial from '/src/components/TutorialModal.jsx'
  import Members from '/src/pages/Members.jsx'
  import '/src/index.css'
  const params=new URLSearchParams(location.search)
  const lang=params.get('lang')||'zh'
  function Fixture() {
    const [open,setOpen]=React.useState(false)
    return React.createElement('main',{style:{transform:'translateX(0)',padding:16}},
      React.createElement('button',{onClick:()=>setOpen(true)},'Guide'),
      React.createElement(Members,{currentUserProfile:{id:'test',role:'ordinary_member',is_active:true},lang}),
      open&&React.createElement(Tutorial,{lang,onClose:()=>setOpen(false)}))
  }
  createRoot(document.getElementById('root')).render(React.createElement(Fixture))
</script></body></html>
