<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import Blog from '/src/pages/Blog.jsx';
import '/src/index.css';
const params=new URLSearchParams(location.search);
if(params.get('mode')==='article') history.replaceState(null,'','/blog/test-story');
else if(params.has('view')) history.replaceState(null,'','/'+params.get('view'));
createRoot(document.getElementById('root')).render(React.createElement(Blog,{profile:params.has('member')?{is_active:true,role:'ordinary_member'}:null,lang:'zh',setLang:()=>{}}));
</script></body></html>
